# ───────────────────────────────────────────────────────────────
# CD: Build Docker image & push to Docker Hub
# Runs on push to master or manual trigger
# ───────────────────────────────────────────────────────────────
name: CD - Build & Push Docker

on:
  push:
    branches: [master]
    paths-ignore:
      - "*.md"
      - "plan/**"
      - "tests/**"
  workflow_dispatch: # Allow manual trigger

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run tests
        env:
          TELEGRAM_BOT_TOKEN: fake_token_for_ci
          TELEGRAM_CHAT_ID: "000000000"
        run: pytest -v --tb=short

  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/job-hunter
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Pull latest image
            docker pull ${{ secrets.DOCKER_USERNAME }}/job-hunter:latest

            # Setup crontab if not already configured
            CRON_JOB="0 */4 * * * docker run --rm --env-file ~/job-hunter/.env -v ~/job-hunter/data:/app/data -v ~/job-hunter/logs:/app/logs ${{ secrets.DOCKER_USERNAME }}/job-hunter:latest >> ~/job-hunter/logs/cron.log 2>&1"
            mkdir -p ~/job-hunter/data ~/job-hunter/logs

            # Add crontab only if not already present
            (crontab -l 2>/dev/null | grep -v "job-hunter" ; echo "$CRON_JOB") | crontab -

            echo "Deployed successfully. Crontab set to run every 4 hours."
            crontab -l | grep job-hunter
